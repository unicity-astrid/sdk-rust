[package]
name = "astrid-sdk"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "System SDK for building User-Space Capsules for Astrid OS"
include = ["src/**/*", "wit/**/*", "Cargo.toml", "LICENSE-*", "README.md"]

[dependencies]
astrid-sdk-macros = { workspace = true, optional = true }
astrid-sys = { workspace = true }
borsh = { version = "1.0.0", features = ["derive"] }
chrono = { workspace = true }
schemars = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `request_response` uses uuid v4 for correlation IDs. `rng-getrandom`
# routes v4 through `getrandom`, which astrid-sys configures with a
# custom backend on `wasm32-unknown-unknown` that calls
# `astrid:sys.random-bytes`.
uuid = { version = "1.10", default-features = false, features = ["v4", "serde", "rng-getrandom"] }

[features]
default = ["derive"]
derive = ["dep:astrid-sdk-macros"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
